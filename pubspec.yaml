name: knittda
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+19

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  path_provider: ^2.0.15
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1
  http_parser: ^4.1.2
  gal: ^2.3.2
  share_plus: ^11.0.0
  kakao_flutter_sdk: ^1.9.7+3
  url_launcher: ^6.3.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  sign_in_with_apple: ^6.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/font/ # Pretendard 폰트 경로 추가
    - assets/image/ #image 경로 추가
    - assets/image/stage/ #image 경로 추가

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/font/Pretendard-Regular.otf
        - asset: assets/font/Pretendard-Bold.otf
          weight: 700
        - asset: assets/font/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/font/Pretendard-Light.otf
          weight: 300
        - asset: assets/font/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/font/Pretendard-Thin.otf
          weight: 100
        - asset: assets/font/Pretendard-Medium.otf
          weight: 500
        - asset: assets/font/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/font/Pretendard-Black.otf
          weight: 900

