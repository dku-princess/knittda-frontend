name: Android CI / Build 

on:
  push:
    tags:
      - 'android-beta-v*'

permissions:
  contents: read

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    environment: beta
    concurrency: android-beta
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with: 
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: android

      - name: Decode upload keystore and google-services.json
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          mkdir -p android/app/src/beta
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/src/beta/google-services.json

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Create config/beta.release.json and local.properties
        env: 
          APP_CHANNEL: ${{ secrets.APP_CHANNEL }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          DIRECTUS_BASE_URL: ${{ secrets.DIRECTUS_BASE_URL }}
          DIRECTUS_STATUS: ${{ secrets.DIRECTUS_STATUS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
        run: |
          mkdir -p config
          cat > config/beta.release.json <<EOF
          {
            "APP_CHANNEL": "$APP_CHANNEL",
            "KAKAO_NATIVE_APP_KEY": "$KAKAO_NATIVE_APP_KEY",
            "API_BASE_URL": "$API_BASE_URL",
            "DIRECTUS_BASE_URL": "$DIRECTUS_BASE_URL",
            "DIRECTUS_STATUS": "$DIRECTUS_STATUS",
            "SENTRY_DSN": "$SENTRY_DSN",
            "SENTRY_ENVIRONMENT": "$SENTRY_ENVIRONMENT"
          }
          EOF
          echo "KAKAO_NATIVE_APP_KEY=$KAKAO_NATIVE_APP_KEY" >> android/local.properties
      
      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Build and upload to Google Play Console
        working-directory: android
        env: 
          PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: bundle exec fastlane beta
