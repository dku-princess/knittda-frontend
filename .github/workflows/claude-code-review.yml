name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 Pull Request를 리뷰해 주세요. 이 프로젝트는 Flutter/Dart 앱입니다.
            `gh pr diff`로 변경된 코드를 확인하고, 다음 관점에서 리뷰하세요:

            - 버그와 잠재적 이슈 (null 안정성, 상태 관리, 비동기 처리 등)
            - Dart/Flutter 컨벤션 및 코드 품질
            - 성능 문제 (불필요한 rebuild, 무거운 build 메서드 등)
            - 보안 문제 (하드코딩된 시크릿, 안전하지 않은 데이터 처리 등)
            - 테스트 커버리지

            리뷰 코멘트는 **모두 한국어로** 작성하세요.
            발견한 구체적인 문제는 `mcp__github_inline_comment__create_inline_comment`
            도구로 해당 라인에 인라인 코멘트를 남기세요.
            심각도(critical/warning/nitpick)를 표시하고, 문제가 없으면 그렇게 명확히 알려주세요.
            사소한 스타일 지적으로 과도하게 코멘트하지 마세요.

            **작업을 마치기 전, 리뷰 결과와 무관하게 반드시 `gh pr comment`로
            PR에 요약 코멘트를 1개 남기세요.** (인라인 코멘트를 이미 남겼어도 생략하지 마세요)
            상황에 맞게 다음 중 하나로 작성하세요:
            - 문제를 발견했다면: 발견한 이슈 개수와 심각도 요약
            - 문제가 없다면: "✅ 리뷰 완료 — 특이사항 없음"
            - 파일 규모나 도구 제약 등으로 리뷰를 끝까지 수행하지 못했다면:
              "⚠️ 리뷰를 완료하지 못했습니다" + 구체적인 이유
            이 요약 코멘트는 리뷰가 실제로 수행됐는지 팀원이 한눈에 알 수 있게 하는
            용도이므로, 어떤 경우에도 생략하면 안 됩니다.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Glob,Grep"
