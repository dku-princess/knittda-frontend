name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 Pull Request를 리뷰해 주세요. 이 프로젝트는 Flutter/Dart 앱입니다.
            `gh pr diff`로 변경된 코드를 확인하고, 다음 관점에서 리뷰하세요:

            - 버그와 잠재적 이슈 (null 안정성, 상태 관리, 비동기 처리 등)
            - Dart/Flutter 컨벤션 및 코드 품질
            - 성능 문제 (불필요한 rebuild, 무거운 build 메서드 등)
            - 보안 문제 (하드코딩된 시크릿, 안전하지 않은 데이터 처리 등)
            - 테스트 커버리지

            리뷰 코멘트는 **모두 한국어로** 작성하세요.
            발견한 구체적인 문제는 `mcp__github_inline_comment__create_inline_comment`
            도구로 해당 라인에 인라인 코멘트를 남기세요.
            심각도(critical/warning/nitpick)를 표시하고, 문제가 없으면 그렇게 명확히 알려주세요.
            사소한 스타일 지적으로 과도하게 코멘트하지 마세요.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Glob,Grep"
